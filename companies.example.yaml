# Which company job boards to search.
#
# This is a starter list of 651 companies whose public job boards were tested on 2026-10-23
# and each had at least one open job at that time (Greenhouse and Lever boards were also checked
# for a US-located job; Ashby boards were not individually checked for US location). Boards
# change: companies switch systems, close boards or rename them. A missing board is only a
# warning.
#
# To use your own list, copy this file to "companies.yaml" (git ignores that one) and edit it.
# Each name is the last part of the company's public job-board address, e.g.
# boards.greenhouse.io/<name>, jobs.lever.co/<name>, jobs.ashbyhq.com/<name>.
# Letters, digits, "-" and "_" only. Use "lever_eu" for boards at jobs.eu.lever.co, and
# "smartrecruiters" for jobs.smartrecruiters.com/<name> (US postings only).
#
# "workday" is different and UNOFFICIAL: Workday has no public API, so these entries use the
# address that each company's own career page uses. Each entry is tenant.wdN.SiteName, taken from
# the career page address (nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite). Case matters.
# Every site is checked against its robots.txt first and skipped if it does not allow access.
#
# Cost of a long list: after the app starts, the first search or two return PARTIAL results
# (and say so) while the boards finish loading, which takes about a minute. Once warm,
# the server uses roughly 0.6-0.7 GB of memory (Ashby boards are the heaviest). To make it
# faster and lighter, copy this file to companies.yaml and delete companies you don't need.

